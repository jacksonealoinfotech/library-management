<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 Internal Server Error - Library System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div class="card p-5 shadow-sm border-0" style="max-width: 540px;">
    <div class="mb-3 text-danger opacity-75">
      <i class="bi bi-gear-wide-connected fs-1" style="font-size: 4rem !important;"></i>
    </div>
    <h1 class="display-4 fw-bold text-dark">500</h1>
    <h4 class="fw-semibold text-secondary mb-3">Internal System Error</h4>
    <p class="text-muted small mb-4">
      An unexpected error occurred during database transaction processing. The system administrator has been logged regarding this event.
    </p>
    {% if detail %}
      <div class="alert alert-secondary py-2 small mb-4 text-start font-monospace text-truncate">
        {{ detail }}
      </div>
    {% endif %}
    <div>
      <a href="/dashboard" class="btn btn-primary btn-sm px-4">
        <i class="bi bi-house-door me-1"></i> Back to Safety
      </a>
    </div>
  </div>
</body>
</html>
