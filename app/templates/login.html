<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - {{ app_settings.LIBRARY_NAME }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #0f2b48 0%, #1e3a8a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-card {
      max-width: 440px;
      width: 100%;
      border-radius: 0.85rem;
      box-shadow: 0 1rem 3rem rgba(0, 0, 0, 0.25);
      background-color: #ffffff;
      overflow: hidden;
      border: none;
    }
    .login-header {
      background-color: #0b1f34;
      color: #ffffff;
      padding: 2.25rem 2rem 1.75rem;
      text-align: center;
    }
    .login-body {
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-25 text-white mb-3">
        <i class="bi bi-book-half fs-2 text-primary"></i>
      </div>
      <h4 class="fw-bold mb-1">{{ app_settings.LIBRARY_NAME }}</h4>
      <p class="text-white-50 small mb-0">Library Management System Portal</p>
    </div>

    <div class="login-body">
      <!-- Flash Messages -->
      {% set flashes = get_flashed_messages(request) %}
      {% if flashes %}
        {% for item in flashes %}
          <div class="alert alert-{{ item.category }} alert-dismissible fade show small py-2 mb-3" role="alert">
            <i class="bi bi-info-circle me-1"></i> {{ item.message }}
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
        {% endfor %}
      {% endif %}

      <form method="post" action="/login">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-person"></i></span>
            <input
              type="text"
              class="form-control"
              id="username"
              name="username"
              value="{{ username or '' }}"
              placeholder="Enter username"
              required
              autofocus
            >
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Enter password"
              required
            >
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
        </button>
      </form>

      <div class="mt-4 pt-3 border-top text-center">
        <div class="p-2 bg-light rounded text-muted small">
          <strong class="text-dark d-block mb-1">Demo Credentials:</strong>
          <span>Username: <code>admin</code></span> &bull; 
          <span>Password: <code>admin123</code></span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
